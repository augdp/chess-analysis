[project]
name = "chess-analysis"
version = "0.1.0"
description = "Repo where I analyze my online chess."
requires-python = ">=3.10"
dependencies = [
    "ipywidgets>=8.1.8",
    "kiwisolver==1.4.7",
    "matplotlib>=3.7.0",
    "numexpr>=2.14.1",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "python-chess>=1.999",
    "requests>=2.31.0",
    "seaborn>=0.13.0",
    "tqdm>=4.67.1",
    "urllib3>=2.5.0",
]

[tool.uv.workspace]
members = [
    "chess_tools/openchess",
]
